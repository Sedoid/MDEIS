[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdeis"
version = "0.1.0"
description = "Multidimensional Educational Intelligence System: cited, template-driven findings from school records."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Pre-approved libraries only (docs/DECISIONS.md D-001). Anything else is a "Needs decision".
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer. The stub server is written for 1.x. mcp-engineer decides on 2.x in T-006.
    "mcp>=1.30,<2",
    "pydantic",
    "pyyaml",
    "psycopg[binary]",
    "pgvector",
    "httpx",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
# LangGraph (D-015) is installed only in the orchestrator image, so the other images stay small.
orchestrator = [
    "langgraph",
    "langgraph-checkpoint-postgres",
]
dev = [
    "pytest",
    "ruff",
    # Practice data and its tests (T-002, T-032), dev only (H-11): cards are drawn with fpdf2
    # and read back with pdfplumber.
    "fpdf2",
    "pdfplumber",
    # Imported directly by synthetic/bad_cards.py; it is already installed as a dependency of fpdf2.
    "pillow",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdeis = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a running Postgres with pgvector (DATABASE_URL); skipped otherwise",
    "contract: tests of the tools, written before the tools (Step 7). Step 8 built the tools to pass them",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
