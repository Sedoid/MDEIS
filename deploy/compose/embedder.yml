services:
  embedder:
    image: ${LLAMA_CPP_IMAGE:?set LLAMA_CPP_IMAGE in .env}
    container_name: embedder-${STACK_SUFFIX:?set STACK_SUFFIX in .env}
    restart: unless-stopped
    # llama-server in embedding mode, serving nomic-embed-text-v1.5 (768 dimensions).
    # The model file is not in the image: `make models` downloads it and checks its SHA-256.
    command:
      - "-m"
      - "/models/${EMBED_MODEL_FILE:?set EMBED_MODEL_FILE in .env}"
      - "--embeddings"
      - "--pooling"
      - "mean"
      - "-c"
      - "2048"
      - "-b"
      - "2048"
      - "-ub"
      - "2048"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    mem_limit: ${EMBEDDER_MEM_LIMIT:-1g}
    networks: [data]
    # No ports: only mdeis-mcp calls the embedder, over the data network.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
