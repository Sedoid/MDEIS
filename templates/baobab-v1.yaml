# MDEIS criteria template baobab-v1: the rulebook of the fictional Baobab College. Shape:
# docs/TEMPLATE.md. Loader: src/mdeis/core/template.py.
#
# Built from the structure of v1.1.yaml, with the values of the methodology fixture
# data/synthetic/methodology/methodology-baobab.md (document BAO-METH-1.0, version 1.0). Baobab College
# is a fictional school and this file is a synthetic test fixture. v1.1.yaml belongs to another school
# (Outliers Comprehensive College) and is not edited. This file is a separate version: loading it
# does not change the active rulebook unless it is loaded as the active one on purpose
# (`python -m mdeis.admin load-criteria templates/baobab-v1.yaml --no-activate --by "Name"`).
#
# Two kinds of value are marked in this file:
#   # FROM BAOBAB BAO-METH-1.0 section N: teacher to confirm
#       stated by the Baobab methodology, in the section named. Baobab's own rule.
#   # PLACEHOLDER: teacher to confirm
#       NOT defined by Baobab. The template schema requires a rule here, so one is set so the system
#       can load and run. It is not Baobab's rule and no one at Baobab has said it. The text of each
#       such rule starts "Placeholder, not defined by Baobab". A teacher replaces it with the real
#       value, or says it does not apply. No code change is needed.
#
# What Baobab defines and has no home in this schema:
#   * The steady band (a spread of at most 8 points, section 6.3). No clause of this schema holds
#     it. The build of a generated measure adds it as a measure_params rule when a teacher confirms
#     it; it is not typed here.
#   * Baobab makes no average (section 2) and no group result (section 3.1, rows 2 and 3). The
#     schema still requires the calculation, stage weight, coefficient, area, level and group rules
#     below, so they are placeholders. The class view rules (GM-2, GM-3) are left out on purpose:
#     the class view refuses on this rulebook, which is what Baobab asks for.
#
# Known difference, not hidden: Baobab 6.4 says a change of 10 points or MORE is moved. The fixed
# trend tool counts a move only when the change is MORE THAN the threshold (TR-2). With the
# threshold at Baobab's 10, the two differ for a change of exactly 10 (Baobab case B-06). The number
# is not changed to hide it.

template_id: baobab-demo                  # PLACEHOLDER: teacher to confirm
version: 1                                # PLACEHOLDER: teacher to confirm
language: en                              # PLACEHOLDER: teacher to confirm
institution: {name: "Baobab College", code: BAO}  # FROM BAOBAB BAO-METH-1.0 section 3.1: teacher to confirm
methodology_version: "1.0"                # FROM BAOBAB BAO-METH-1.0 (Version: 1.0): teacher to confirm
start_date: 2027-01-01                    # PLACEHOLDER: teacher to confirm (Baobab: effective school year 2027, no date)
review_date: 2028-01-01                   # PLACEHOLDER: teacher to confirm (Baobab: reviewed at the end of each school year)
approved_by: null                         # stays null until a named person approves these rules
change_log:
  - {version: 1, date: 2026-11-17, note: "First rulebook for the fictional Baobab College, from BAO-METH-1.0. Values marked PLACEHOLDER are not Baobab's."}

scales:
  - id: SC-1
    type: out_of                          # FROM BAOBAB BAO-METH-1.0 section 3.2: teacher to confirm
    max: 100                              # FROM BAOBAB BAO-METH-1.0 section 3.2: teacher to confirm
    method_ref: "5"
    text: "Term scores are out of 100."
  - id: SC-2
    # FROM BAOBAB BAO-METH-1.0 sections 3.2 and 6.1: teacher to confirm (letters and lower edges).
    grade_bands:                          # min is the lowest score in the band
      - {grade: "A", min: 80}
      - {grade: "B", min: 70}
      - {grade: "C", min: 60}
      - {grade: "D", min: 50}
      - {grade: "E", min: 0}
    method_ref: "6.1"
    text: "80 to 100 is band A, 70 to 79 is B, 60 to 69 is C, 50 to 59 is D, 0 to 49 is E."
  - id: SC-3
    pass_mark: 50                         # FROM BAOBAB BAO-METH-1.0 sections 3.2 and 6.2: teacher to confirm
    method_ref: "6.2"
    text: "A term score of 50 or more out of 100 meets the pass mark."

# PLACEHOLDER: teacher to confirm. Baobab makes no average, so it gives no coefficients. The schema
# needs at least one rule; every subject Baobab names has coefficient 1.
coefficients:
  - id: WT-1
    subjects:
      Mathematics: 1
      English: 1
      Science: 1
      Humanities: 1
    text: "Placeholder, not defined by Baobab: Mathematics, English, Science and Humanities each have coefficient 1."

# PLACEHOLDER: teacher to confirm. Baobab has Forms 1 to 4 (section 3.1) and makes no average, so it
# gives no stage weights. Every Form is set to count once.
stage_weights:
  - id: SW-1
    stages: {"Form 1": 1, "Form 2": 1, "Form 3": 1, "Form 4": 1}
    text: "Placeholder, not defined by Baobab: a term score counts once in every Form."

# PLACEHOLDER: teacher to confirm every rule in this section. Baobab says it makes no average
# (section 2), so none of these is Baobab's. The schema requires each calculation to be set.
# terms_per_year is not stated by Baobab (it says one score at the end of each term).
calculations:
  - id: CA-1
    terms_per_year: 3
    annual_score: mean_of_terms
    text: "Placeholder, not defined by Baobab: a year has 3 terms, and an annual score would be the average of its 3 term scores."
  - id: CA-2
    annual_average: coefficient_weighted
    text: "Placeholder, not defined by Baobab: an annual average would weight each subject by its coefficient."
  - id: CA-3
    skill_term_value: coefficient_weighted
    text: "Placeholder, not defined by Baobab: a skill's score in one term would weight its subjects by their coefficients."
  - id: CA-4
    window_average: stage_weighted
    text: "Placeholder, not defined by Baobab: scores from different school years would be weighted by their stage weight."
  - id: CA-5
    gap: distance_to_range
    text: "Placeholder, not defined by Baobab: the gap is the distance between a score and the nearest edge of the expected range for the stage. It is zero inside the range."

foundation_areas: [literacy, numeracy]    # PLACEHOLDER: teacher to confirm

areas:
  # PLACEHOLDER: teacher to confirm. Baobab lists four subjects and no learning areas.
  - id: SK-1
    area: literacy
    subjects: [English]
    text: "Placeholder, not defined by Baobab: English makes up literacy."
  - id: SK-2
    area: numeracy
    subjects: [Mathematics]
    text: "Placeholder, not defined by Baobab: Mathematics makes up numeracy."

# PLACEHOLDER: teacher to confirm. Baobab's Course Outlines say what each Form is expected to learn
# but give no score range. One invented range is used for every Form and area, so nothing can be read
# into a difference between them.
stage_expectations:
  - id: ST-1
    stage: "Form 1"
    area: literacy
    range: [50, 80]
    text: "Placeholder, not defined by Baobab: Form 1 literacy is expected between 50 and 80 out of 100."
  - id: ST-2
    stage: "Form 2"
    area: literacy
    range: [50, 80]
    text: "Placeholder, not defined by Baobab: Form 2 literacy is expected between 50 and 80 out of 100."
  - id: ST-3
    stage: "Form 3"
    area: literacy
    range: [50, 80]
    text: "Placeholder, not defined by Baobab: Form 3 literacy is expected between 50 and 80 out of 100."
  - id: ST-4
    stage: "Form 4"
    area: literacy
    range: [50, 80]
    text: "Placeholder, not defined by Baobab: Form 4 literacy is expected between 50 and 80 out of 100."
  - id: ST-5
    stage: "Form 1"
    area: numeracy
    range: [50, 80]
    text: "Placeholder, not defined by Baobab: Form 1 numeracy is expected between 50 and 80 out of 100."
  - id: ST-6
    stage: "Form 2"
    area: numeracy
    range: [50, 80]
    text: "Placeholder, not defined by Baobab: Form 2 numeracy is expected between 50 and 80 out of 100."
  - id: ST-7
    stage: "Form 3"
    area: numeracy
    range: [50, 80]
    text: "Placeholder, not defined by Baobab: Form 3 numeracy is expected between 50 and 80 out of 100."
  - id: ST-8
    stage: "Form 4"
    area: numeracy
    range: [50, 80]
    text: "Placeholder, not defined by Baobab: Form 4 numeracy is expected between 50 and 80 out of 100."

# PLACEHOLDER: teacher to confirm. Baobab defines no levels against a stage range. The names are the
# fixed tools' names; the statements describe a result against the stage range and say nothing about
# the child. They describe what the fixed tool works out (an average of the window), which Baobab
# does not do (section 2).
levels:
  - id: LV-1
    name: below_expected_range
    statement: "The average of the last 3 term scores is below the expected range for the stage."
    text: "Placeholder, not defined by Baobab: a result is described as below the expected range when the average of the last 3 term scores is lower than the bottom of the range for the stage and area."
  - id: LV-2
    name: within_expected_range
    statement: "The average of the last 3 term scores is within the expected range for the stage."
    text: "Placeholder, not defined by Baobab: a result is described as within the expected range when the average of the last 3 term scores is inside the range for the stage and area, bounds included."
  - id: LV-3
    name: above_expected_range
    statement: "The average of the last 3 term scores is above the expected range for the stage."
    text: "Placeholder, not defined by Baobab: a result is described as above the expected range when the average of the last 3 term scores is higher than the top of the range for the stage and area."
  - id: LV-4
    name: insufficient_evidence
    statement: "There are too few term scores to say where the result sits against the expected range."
    text: "Placeholder, not defined by Baobab: when the minimum evidence in TR-1 is not met, no statement is made about the expected range."

# method_ref links a rule to the section of BAO-METH-1.0 it implements.
trend:
  - id: TR-1
    min_scores: 2                         # FROM BAOBAB BAO-METH-1.0 sections 3.2 and 5: teacher to confirm
    min_terms: 2                          # PLACEHOLDER: teacher to confirm (Baobab states scores, not terms)
    window_terms: 3                       # FROM BAOBAB BAO-METH-1.0 sections 3.2 and 5: teacher to confirm
    method_ref: "5"
    text: "A pattern is stated only with at least 2 term scores in the window. The window is the last 3 term scores recorded in the subject. With fewer than 2 scores the report says there is not enough evidence."
  - id: TR-2
    move_threshold: 10                    # FROM BAOBAB BAO-METH-1.0 sections 3.2 and 6.4: teacher to confirm
    method_ref: "6.4"
    text: "The change is the last score minus the first score in the window. The moved threshold is 10 points out of 100. Baobab section 6.4 counts a change of 10 points or more as moved. The fixed trend tool counts a change of more than 10 points as moved."
  - id: TR-3
    missing_term: ask_approver            # PLACEHOLDER: teacher to confirm (Baobab does not block a subject for a missing term)
    method_ref: "5"
    text: "A missing term score is not recorded and is never treated as zero. Holding the subject for the approver is a placeholder: Baobab does not state it."
  - id: TR-4
    gap_direction_threshold: 5            # PLACEHOLDER: teacher to confirm (Baobab has no gap measure)
    text: "Placeholder, not defined by Baobab: the gap to the stage range is widening, steady or closing by a change of more than 5 points out of 100."

exceptions:
  - id: EX-1
    absences: context_only                # PLACEHOLDER: teacher to confirm (Baobab does not mention absences)
    text: "Placeholder, not defined by Baobab: absences are shown as context. They are never used to calculate a result."

# PLACEHOLDER: teacher to confirm every word list in this section. Baobab says no trait, no ranking,
# no comparison of learners and no pathway (section 2, rule BAO-07) but lists no words.
wording:
  - id: WD-1
    banned: [weak, remedial, gifted, lazy, slow, failing, brilliant]
    text: "Describe the data. Never attach a label to the child. Report the band letter and its score range."
  - id: WD-2
    banned_phrases: ["top group", "bottom group", "top set", "bottom set", "ability group", "fast track", "slow track", "low ability", "high ability"]
    text: "Do not split a class into tracks or ability groups, and do not name a group by ability."
  - id: WD-3
    banned_phrases: ["career path", "career pathway", "subject choice", "choose a career", "future career"]
    text: "Do not suggest a pathway, a subject choice or a career for any learner."

group_minimum:
  - id: GM-1
    min_group_size: 10                    # PLACEHOLDER: teacher to confirm (Baobab makes no group result)
    text: "Placeholder, not defined by Baobab: groups smaller than 10 are never shown."
